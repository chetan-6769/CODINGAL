<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Demo</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- 🔥 Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">My Website</a>
  </div>
</nav>

<!-- 🔥 Hero Section -->
<div class="container text-center my-5">
    <h1>Welcome to My Responsive Website</h1>
    <p>This site uses Bootstrap Grid System</p>
</div>

<!-- 🔥 Grid System Section -->
<div class="container">
    <div class="row">
        <!-- Column 1 -->
        <div class="col-md-4 bg-primary text-white p-3">
            <h3>Column 1</h3>
            <p>This is column one</p>
        </div>

        <!-- Column 2 -->
        <div class="col-md-4 bg-success text-white p-3">
            <h3>Column 2</h3>
            <p>This is column two</p>
        </div>

        <!-- Column 3 -->
        <div class="col-md-4 bg-danger text-white p-3">
            <h3>Column 3</h3>
            <p>This is column three</p>
        </div>
    </div>
</div>

<!-- 🔥 Cards Section -->
<div class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Card 1</h5>
                    <p class="card-text">Bootstrap makes design easy.</p>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Card 2</h5>
                    <p class="card-text">Fully responsive layout.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 🔥 Footer -->
<footer class="bg-dark text-white text-center p-3">
    <p>© 2026 My Website</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
